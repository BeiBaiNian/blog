<text x="600.0" y="59" font-size="11" fill="#94A6B8" text-anchor="middle" font-weight="400">psql · records</text>
<text x="456" y="92" font-size="12" fill="#22D3EE" text-anchor="start" font-weight="400" class="mono">select id, length(packet)</text>
<text x="456" y="114" font-size="12" fill="#22D3EE" text-anchor="start" font-weight="400" class="mono">  from records limit 3;</text>
<text x="456" y="144" font-size="12" fill="#94A6B8" text-anchor="start" font-weight="400" class="mono">     id      | bytes</text>
<text x="456" y="162" font-size="12" fill="#2C3846" text-anchor="start" font-weight="400" class="mono">-------------+-------</text>
<text x="456" y="184" font-size="12" fill="#E8EFF7" text-anchor="start" font-weight="400" class="mono"> 5d2a9c1f…   |   412</text>
<text x="456" y="206" font-size="12" fill="#E8EFF7" text-anchor="start" font-weight="400" class="mono"> 0b7e44d2…   |  1024</text>
<text x="456" y="228" font-size="12" fill="#E8EFF7" text-anchor="start" font-weight="400" class="mono"> c81f37aa…   |   380</text>
<text x="456" y="272" font-size="12" fill="#FBBF24" text-anchor="start" font-weight="400" class="mono">-- 没有 title / body / tag 列</text>
<text x="456" y="294" font-size="12" fill="#94A6B8" text-anchor="start" font-weight="400" class="mono">-- 想读内容只能先拿密钥</text>
